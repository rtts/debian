- name: Install mail server
  become: true
  apt:
    state: present
    name: exim4

- name: Set mailname
  become: true
  copy:
    dest: /etc/mailname
    content: "{{ inventory_hostname_short }}.{{ domain_name }}\n"
  when: domain_name is defined

- name: Configure mail server
  become: true
  template:
    src: update-exim4.conf.conf
    dest: /etc/exim4/
  notify: update exim4
  when: domain_name is defined and smtp_server is defined

- name: Set SMTP credentials
  become: true
  copy:
    content: "{{ smtp_server }}:{{ smtp_username }}:{{ smtp_password }}\n"
    dest: /etc/exim4/passwd.client
  when: smtp_server is defined and smtp_username is defined and smtp_password is defined

- name: Forward all system mail to {{ email_address }}
  become: true
  lineinfile:
    path: /etc/aliases
    regexp: 'root:'
    line: 'root: {{ email_address }}'
  when: email_address is defined
